name: deploy

# Ссылка должна открываться к концу каждого дня (PLAN.md). Поэтому деплой
# висит на пуше в main, а не запускается руками: ручной шаг забывается ровно
# в тот день, когда работы больше всего.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одна выкладка за раз. Отменять начатую не даём: оборванный деплой оставляет
# жюри белую страницу, а это дороже лишней минуты ожидания.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Тесты до сборки: модель узора — единственное, что нельзя выкатить
      # сломанным. Красный тест здесь значит, что доска не собирается.
      - run: npx vitest run
      - run: npx tsc --noEmit
      - run: npx vite build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
